<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria Real-Time IK Solver</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            min-width: 300px;
        }

        #ui-panel h2 {
            margin-top: 0;
            color: #00ff88;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .control-group input, .control-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #333;
            color: white;
        }

        .control-group input:focus, .control-group select:focus {
            outline: none;
            border-color: #00ff88;
        }

        button {
            background: #00ff88;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }

        button:hover {
            background: #00cc66;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-family: monospace;
        }

        #drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px dashed #00ff88;
            padding: 40px;
            text-align: center;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 10px;
            display: none;
        }

        #drop-zone.visible {
            display: block;
        }

        #drop-zone.dragover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00cc66;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="ui-panel">
            <h2>🎯 Aria Real-Time IK Solver</h2>

            <div class="control-group">
                <label for="bone-select">Target Bone:</label>
                <select id="bone-select">
                    <option value="leftHand">Left Hand</option>
                    <option value="rightHand">Right Hand</option>
                    <option value="leftFoot">Left Foot</option>
                    <option value="rightFoot">Right Foot</option>
                    <option value="head">Head</option>
                </select>
            </div>

            <div class="control-group">
                <label>Target Position:</label>
                <div style="display: flex; gap: 5px;">
                    <input type="number" id="target-x" step="0.1" placeholder="X" value="0.5">
                    <input type="number" id="target-y" step="0.1" placeholder="Y" value="1.2">
                    <input type="number" id="target-z" step="0.1" placeholder="Z" value="0.3">
                </div>
            </div>

            <div class="control-group">
                <button id="update-target">Update Target</button>
                <button id="load-vrma">Load VRMA</button>
            </div>

            <div id="status">
                Status: Initializing...<br>
                WebSocket: <span id="ws-status">Disconnected</span><br>
                Model: <span id="model-status">None loaded</span>
            </div>
        </div>

        <div id="drop-zone">
            <h3>Drop VRMA File Here</h3>
            <p>Or click to browse</p>
            <input type="file" id="file-input" accept=".vrm,.vrma" style="display: none;">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@1.0.0/dist/three-vrm.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
