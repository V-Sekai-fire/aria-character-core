<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aria IK Solver - Real-time 3D Testing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #scene {
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            min-width: 300px;
        }

        #ui h2 {
            margin: 0 0 15px 0;
            color: #00ff88;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .control-group select,
        .control-group input {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #00ff88;
        }

        #drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px dashed #555;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            color: #aaa;
            font-size: 18px;
            display: none;
            z-index: 1000;
        }

        #drop-zone.dragover {
            border-color: #00ff88;
            background: rgba(0, 136, 0, 0.2);
            color: #00ff88;
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
        }

        .bone-highlight {
            background: rgba(255, 255, 0, 0.3) !important;
        }

        .target-sphere {
            opacity: 0.7;
        }

        .error {
            color: #ff4444;
        }

        .success {
            color: #00ff88;
        }

        .info {
            color: #44aaff;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="scene"></div>

        <div id="ui">
            <h2>Aria IK Solver</h2>

            <div class="control-group">
                <label for="bone-select">Select Bone:</label>
                <select id="bone-select">
                    <option value="">Choose a bone...</option>
                    <option value="leftHand">Left Hand</option>
                    <option value="rightHand">Right Hand</option>
                    <option value="leftFoot">Left Foot</option>
                    <option value="rightFoot">Right Foot</option>
                    <option value="head">Head</option>
                </select>
            </div>

            <div class="control-group">
                <label for="target-x">Target X:</label>
                <input type="number" id="target-x" step="0.1" value="0.5">
            </div>

            <div class="control-group">
                <label for="target-y">Target Y:</label>
                <input type="number" id="target-y" step="0.1" value="1.2">
            </div>

            <div class="control-group">
                <label for="target-z">Target Z:</label>
                <input type="number" id="target-z" step="0.1" value="0.3">
            </div>

            <button id="update-target" style="width: 100%; padding: 10px; background: #00ff88; border: none; border-radius: 4px; color: #000; font-weight: bold; cursor: pointer;">
                Update IK Target
            </button>
        </div>

        <div id="drop-zone">
            <div>Drop VRM file here</div>
            <div style="font-size: 14px; margin-top: 10px;">(.vrm files only)</div>
        </div>

        <div id="status" class="info">
            Ready - Drag and drop a VRM file to begin
        </div>
    </div>

    <!-- Three.js and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.0-beta.8/lib/three-vrm.min.js"></script>

    <!-- Phoenix Socket -->
    <script src="https://cdn.jsdelivr.net/npm/phoenix@1.6.6/priv/static/phoenix.min.js"></script>

    <!-- Main application script -->
    <script src="js/app.js"></script>
</body>
</html>
